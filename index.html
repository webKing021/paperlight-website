<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paperlight · Every document on your PC, one search away</title>
    <meta
      name="description"
      content="Paperlight is a free, open-source Windows app that finds any PDF, Word, Excel or PowerPoint file on your PC by name, folder or the words inside. Offline, read-only and tiny."
    />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="__SITE_URL__/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Paperlight" />
    <meta property="og:title" content="Paperlight · Every document on your PC, one search away" />
    <meta
      property="og:description"
      content="Find any PDF, Word, Excel or PowerPoint file by name, folder or the words inside. Free, open source, offline."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/og.png" />

    <!-- Dark is the default; a saved (or ?theme=light) choice is applied before the first paint. -->
    <script>
      try {
        var asked = new URLSearchParams(location.search).get("theme");
        if (asked === "light" || asked === "dark") localStorage.setItem("paperlight-theme", asked);
        if (localStorage.getItem("paperlight-theme") === "light") {
          document.documentElement.classList.remove("dark");
          document.querySelector('meta[name="theme-color"]').content = "#ffffff";
        }
      } catch (e) {}
      // Scroll reveals: only hide content when it can be revealed again (see src/lib/reveal.ts).
      if ("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("reveal");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui; padding: 24px">
        Paperlight finds every document on your PC.
        <a href="https://github.com/webKing021/paperlight/releases/latest">Download for Windows</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
